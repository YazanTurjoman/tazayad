<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tazayad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: a single-screen card table — wooden rail, green felt, six seats around an oval, your fanned hand at the bottom. */
:root{
  --felt:#13704f; --felt-deep:#0a4333; --wood:#3b2312; --wood-hi:#7b4a24;
  --gold:#f2c35b; --ink:#f7f2e6; --muted:#b7d2c4; --card:#fffdf6; --card-edge:#d9d2bf;
  --red:#c51f2d; --blk:#16171b; --t0:#f6a524; --t1:#46c2ff; --t2:#ff6fb1; --ok:#5ee3a0; --bad:#ff7070;
  --panel:rgba(6,30,23,.78); --line:rgba(255,255,255,.14);
  --display:"Cairo",system-ui,sans-serif; --body:"Tajawal","Cairo",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#5a351b 0%,var(--wood) 55%,#24140a 100%);color:var(--ink);font-family:var(--body);direction:rtl;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.screen{height:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- lobby ---------- */
#lobby{overflow-y:auto;padding-block:20px 28px}
.lob{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.brand{text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.brand h1{font-family:var(--display);font-weight:900;font-size:clamp(34px,10vw,52px);line-height:1.1;margin:0;color:var(--gold);text-shadow:0 3px 0 #000a}
.brand .suits{font-size:22px;letter-spacing:10px;color:var(--ink);opacity:.85}
.brand .suits .r{color:#ff6b75}
.brand p{margin:0;color:var(--muted);font-size:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.box h2{margin:0;font-family:var(--display);font-size:17px;font-weight:800}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink)}
.btn{font-family:var(--display);font-weight:800;font-size:16px;padding:11px 18px;border-radius:12px;background:linear-gradient(#f7d27a,#e0a832);color:#3a2306;box-shadow:0 3px 0 #8a5a12}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8a5a12}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{font-size:14px;padding:8px 12px}
.teams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.tcol h3{margin:0;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.slot{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;background:rgba(0,0,0,.28);border:1px dashed var(--line);min-height:24px;min-width:0;text-align:start;width:100%;box-sizing:border-box}
.slot.full{border-style:solid}
.slot.sel{outline:2px solid var(--gold)}
.slot .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.slot .no{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot .x{font-size:16px;color:var(--bad);padding:0 4px}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.12);color:var(--muted)}
.note{font-size:13px;color:var(--muted);line-height:1.6;margin:0}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.status b{color:var(--ink)}
.live{width:8px;height:8px;border-radius:50%;background:var(--bad)}
.live.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}

/* ---------- game ---------- */
#game{display:flex;flex-direction:column;padding-block:8px 6px;gap:6px}
.top{display:flex;flex-direction:column;gap:6px}.scores{display:flex;gap:6px}.info{display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 8px}.info .ct{flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info .ct .r{color:#ff6b75}.info .rd{font-size:11px;color:var(--muted);white-space:nowrap}.info .btn{font-size:12px;padding:5px 9px}.score.me{box-shadow:inset 0 0 0 1.5px var(--tc)}.dbl{font-size:10px;font-weight:800;background:var(--bad);color:#fff;border-radius:6px;padding:0 4px}
.score{flex:1;min-width:0;border-radius:12px;padding:6px 8px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.score .lb{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.score .pt{font-family:var(--display);font-weight:900;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.score .tk{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.mid{flex:1.25;min-width:0;border-radius:12px;padding:6px 8px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1px}
.mid .rd{font-size:11px;color:var(--muted)}
.mid .ct{font-family:var(--display);font-weight:800;font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mid .ct .r{color:#ff6b75}
.tools{display:flex;gap:6px;justify-content:space-between}
.tools .btn{font-size:12px;padding:6px 10px}

#table{position:relative;flex:1;min-height:250px;direction:ltr}
.felt{position:absolute;inset:7% 9% 9%;border-radius:46%/40%;background:radial-gradient(70% 60% at 50% 45%,#1b8a62 0%,var(--felt) 45%,var(--felt-deep) 100%);box-shadow:0 0 0 10px var(--wood-hi),0 0 0 13px #2a170a,0 14px 30px #000a,inset 0 0 40px #0008}
.felt::after{content:"";position:absolute;inset:14px;border-radius:inherit;border:1.5px solid rgba(242,195,91,.22)}
.center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;color:rgba(255,255,255,.2)}
.center .big{font-size:clamp(46px,14vw,80px);line-height:1}
.center .big.r{color:rgba(255,90,100,.28)}
.center .sm{font-family:var(--display);font-weight:800;font-size:14px;color:rgba(255,255,255,.35)}

.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:84px;z-index:3}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:18px;color:#1b1206;border:3px solid var(--tc);background:radial-gradient(circle at 35% 30%,#fff3d6,#d9b77a);box-shadow:0 3px 8px #0009;position:relative}
.av.bot{background:radial-gradient(circle at 35% 30%,#e6eef3,#9fb3c0)}
.seat.turn .av{box-shadow:0 0 0 3px var(--gold),0 0 18px 4px rgba(242,195,91,.8);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--gold),0 0 6px 1px rgba(242,195,91,.4)}}
.nmtag{max-width:84px;font-size:12px;font-weight:700;padding:1px 7px;border-radius:99px;background:rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl}
.cnt{position:absolute;bottom:-4px;left:-8px;font-size:10px;font-weight:700;background:var(--blk);border:1px solid var(--line);border-radius:7px;padding:0 4px;font-variant-numeric:tabular-nums;color:var(--ink)}
.dealer{position:absolute;top:-6px;right:-10px;font-size:10px;font-weight:800;background:var(--gold);color:#3a2306;border-radius:7px;padding:0 4px}
.bubble{position:absolute;top:-8px;left:50%;transform:translate(-50%,-100%);background:var(--card);color:var(--blk);font-family:var(--display);font-weight:900;font-size:14px;padding:1px 9px;border-radius:10px;white-space:nowrap;box-shadow:0 2px 6px #0007}
.bubble.pass{color:#777;font-weight:700}
.bubble.win{background:var(--gold);color:#3a2306}

.card{position:absolute;width:var(--cw);height:var(--ch);border-radius:7px;background:var(--card);border:1px solid var(--card-edge);box-shadow:0 2px 5px rgba(0,0,0,.45);color:var(--blk);direction:ltr;user-select:none;box-sizing:border-box}
.card.r{color:var(--red)}
.card .ix{position:absolute;top:3px;left:4px;display:flex;flex-direction:column;align-items:center;line-height:.95;font-family:var(--display);font-weight:900}
.card .ix b{font-size:calc(var(--cw)*.31)}
.card .ix i{font-style:normal;font-size:calc(var(--cw)*.27)}
.card .pip{position:absolute;right:5px;bottom:2px;font-size:calc(var(--cw)*.5);line-height:1}
.card.face .pip{font-family:var(--display);font-weight:900}
.card.trumpc{background:linear-gradient(#fffdf6 60%,#fff1c9)}
#trick{position:absolute;inset:0;pointer-events:none;--cw:clamp(40px,11vw,56px);--ch:calc(var(--cw)*1.42)}
#trick .card{transform:translate(-50%,-50%) rotate(var(--rot,0deg));transition:left .25s,top .25s,opacity .25s}
#trick .card.won{box-shadow:0 0 0 2px var(--gold),0 4px 12px #000a}

.panel{min-height:58px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:7px;justify-content:center}
.panel .msg{font-size:14px;text-align:center;line-height:1.4}
.panel .msg b{color:var(--gold)}
.bids{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.bids.two{grid-template-columns:1fr 1fr}.bids.two button{font-size:15px}
.bids button{font-family:var(--display);font-weight:900;font-size:17px;padding:7px 0;border-radius:10px;background:var(--card);color:var(--blk);box-shadow:0 3px 0 #9d9480;font-variant-numeric:tabular-nums}
.bids button[disabled]{opacity:.25}
.bids button.pass{background:#3a4a44;color:var(--ink);box-shadow:0 3px 0 #1d2622;font-size:15px}
.decl{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.decl button{font-family:var(--display);font-weight:900;font-size:16px;padding:6px 0;border-radius:10px;background:var(--card);color:var(--blk);box-shadow:0 3px 0 #9d9480;font-variant-numeric:tabular-nums}.decl button.on{background:var(--gold)}.dblrow{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px}.dblbtn{font-family:var(--display);font-weight:800;padding:6px 14px;border-radius:10px;background:#3a4a44;box-shadow:0 3px 0 #1d2622}.dblbtn.on{background:var(--bad);color:#fff}
.trumps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.trumps button{background:var(--card);color:var(--blk);border-radius:10px;padding:6px 0;box-shadow:0 3px 0 #9d9480;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;font-weight:700}
.trumps button span{font-size:24px;line-height:1.1}
.trumps button.r{color:var(--red)}
.trumps button.sun{background:#ffe9a8}

#hand{position:relative;height:calc(var(--ch) + 18px);direction:ltr;--cw:clamp(50px,13.5vw,64px);--ch:calc(var(--cw)*1.42);margin-bottom:env(safe-area-inset-bottom,0px)}
#hand .card{bottom:0;transition:transform .15s,opacity .15s,filter .15s}
#hand .card.legal{cursor:pointer}
#hand .card.dim{filter:brightness(.55)}
#hand .card.sel{transform:translateY(-16px);box-shadow:0 0 0 2px var(--gold),0 8px 14px #000a}
.spect{text-align:center;color:var(--muted);font-size:13px;padding:10px}

.ov{position:fixed;inset:0;background:rgba(5,12,9,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-width:440px;max-height:100%;overflow-y:auto;box-sizing:border-box;background:linear-gradient(#173f31,#0d2b21);border:1px solid rgba(242,195,91,.4);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px #000c}
.sheet h2{margin:0;font-family:var(--display);font-weight:900;font-size:22px;color:var(--gold);text-align:center}
.verdict{text-align:center;font-size:15px;line-height:1.6}
.verdict .ok{color:var(--ok);font-weight:700}.verdict .bad{color:var(--bad);font-weight:700}
table.res{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
table.res th,table.res td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
table.res th{font-size:12px;color:var(--muted);font-weight:500}
table.res tr.tot td{font-family:var(--display);font-weight:900;font-size:18px;border-bottom:0}
.rules{font-size:14px;line-height:1.75;margin:0;padding-inline-start:18px}
.rules b{color:var(--gold)}
.lasttrick{position:relative;height:90px;direction:ltr;--cw:46px;--ch:66px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000d;color:var(--ink);padding:9px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:calc(100% - 40px);text-align:center}
.cd{position:absolute;top:-6px;right:-10px;font-size:11px;font-weight:800;background:var(--bad);color:#fff;border-radius:8px;padding:0 5px;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
#micBtn.on{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-height:760px){#table{min-height:340px}}
@media (orientation:landscape) and (max-height:620px){
  #game{display:grid;grid-template-columns:minmax(230px,300px) 1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"top table" "panel table" "hand hand";gap:6px;padding-block:6px}
  #top{grid-area:top}
  #top .scores{flex-direction:column}
  #table{grid-area:table;min-height:0;height:100%}
  #panel{grid-area:panel;min-width:0}
  #hand{grid-area:hand}
  .score .pt{font-size:18px}
  .mid{display:none}
}
</style>

<div id="lobby" class="screen" hidden></div>
<div id="game" class="screen" hidden>
  <div class="top" id="top"></div>
  <div id="table">
    <div class="felt"></div>
    <div class="center" id="center"></div>
    <div id="trick"></div>
    <div id="seats"></div>
  </div>
  <div class="panel" id="panel"></div>
  <div id="hand"></div>
</div>
<div id="ov" class="ov" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script id="engine">
/* ===== Game engine (pure, no DOM) ===== */
var E = (function () {
  var SUITS = ['S', 'H', 'D', 'C'];
  var TR = {11:13, 9:12, 14:11, 10:10, 13:9, 12:8, 8:7, 7:6, 6:5, 5:4, 4:3, 3:2, 2:1};
  var SN = {14:13, 10:12, 13:11, 12:10, 11:9, 9:8, 8:7, 7:6, 6:5, 5:4, 4:3, 3:2, 2:1};
  var ROUNDS = 5, MINBID = 3, MAXBID = 17;
  function suit(c) { return c[0]; }
  function rank(c) { return parseInt(c.slice(1, -1), 10); }
  function team(s) { return s % 3; }
  var P = []; // cards played so far this round
  function setPlayed(a) { P = a || []; }
  function twin(c) { return c.slice(0, -1) + (c.slice(-1) === 'a' ? 'b' : 'a'); }
  function str(c, trump) {
    // copy bonuses stay below 1 so they never lift a card above a higher rank
    var v = (suit(c) === trump ? TR : SN)[rank(c)] + (c.slice(-1) === 'b' ? 0.25 : 0);
    // the other copy went out EARLIER than this one (or this one is still in hand): this one is bigger
    var ci = P.indexOf(c), ti = P.indexOf(twin(c));
    if (ti >= 0 && (ci < 0 || ti < ci)) v += 0.5;
    return v;
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function deck() {
    var d = [];
    ['a', 'b'].forEach(function (cp) {
      SUITS.forEach(function (s) {
        for (var r = 2; r <= 14; r++) { if (s === 'S' && r === 2) continue; d.push(s + r + cp); }
      });
    });
    return d; // 102 cards
  }
  function shuffle(a, rnd) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function beats(c, b, trump) {
    if (suit(c) === suit(b)) return str(c, trump) > str(b, trump);
    return trump !== 'N' && suit(c) === trump;
  }
  function winnerIdx(trick, trump) {
    var bi = 0;
    for (var i = 1; i < trick.length; i++) if (beats(trick[i].card, trick[bi].card, trump)) bi = i;
    return bi;
  }
  function legal(st, seat) {
    setPlayed(st.played);
    var hand = (st.hands['s' + seat] || []).slice(), trick = st.trick, trump = st.trump;
    if (!trick.length) return hand;
    var led = suit(trick[0].card);
    var wn = trick[winnerIdx(trick, trump)].seat, partnerWin = team(wn) === team(seat);
    var follow = hand.filter(function (c) { return suit(c) === led; });
    if (follow.length) {
      // raising in trump: must go over the top trump, unless my partner is the one winning
      if (trump !== 'N' && led === trump && !partnerWin) {
        var best = trick.filter(function (t) { return suit(t.card) === trump; }).map(function (t) { return t.card; })
          .reduce(function (a, b) { return str(b, trump) > str(a, trump) ? b : a; });
        var up = follow.filter(function (c) { return str(c, trump) >= str(best, trump) || Math.floor(str(c, trump)) % 100 === Math.floor(str(best, trump)) % 100; });
        if (up.length) return up;
      }
      return follow;
    }
    if (trump === 'N') return hand;
    if (partnerWin && trick.length === 5) return hand; // I am last and my partner has the top card
    var trumps = hand.filter(function (c) { return suit(c) === trump; });
    if (!trumps.length) return hand;
    var played = trick.filter(function (t) { return suit(t.card) === trump; });
    if (!played.length) return trumps;
    var bc = played.map(function (t) { return t.card; }).reduce(function (a, b) { return str(b, trump) > str(a, trump) ? b : a; });
    var hi = trumps.filter(function (c) { return str(c, trump) >= str(bc, trump) || Math.floor(str(c, trump)) % 100 === Math.floor(str(bc, trump)) % 100; });
    return hi.length ? hi : hand; // someone cut above all my trumps: any card
  }
  // order in which the six players declare: bidder's team first (bidder, then partner), then the other two teams
  function declQueue(b, seats) {
    var order = [], q = [], k;
    for (k = 0; k < 6; k++) order.push((b + k) % 6);
    for (k = 0; k < 3; k++) {
      var t = (team(b) + k) % 3;
      var ss = order.filter(function (s) { return team(s) === t; });
      if (seats[ss[0]] && seats[ss[0]].bot && seats[ss[1]] && !seats[ss[1]].bot) ss = [ss[1], ss[0]]; // human partner goes first
      q.push(ss[0], ss[1]);
    }
    return q;
  }
  function initial() {
    return { ver: 0, phase: 'lobby', seats: [null, null, null, null, null, null], round: 0, rounds: ROUNDS, dealer: 0,
      hands: {}, bid: null, trump: null, bidder: -1, contract: 0, trick: [], lastTrick: [], turn: -1, leader: -1,
      pause: false, lastWinner: -1, won: { t0: 0, t1: 0, t2: 0 }, scores: { t0: 0, t1: 0, t2: 0 }, history: [], decl: {}, doubles: {}, declQueue: [], declIdx: 0, deadline: 0, redeal: 0, played: [] };
  }
  function deal(st, rnd) {
    var d = shuffle(deck(), rnd);
    st.hands = {};
    for (var i = 0; i < 6; i++) st.hands['s' + i] = d.slice(i * 17, i * 17 + 17);
    st.bid = { high: 0, seat: -1, passed: {}, log: {} };
    st.phase = 'bidding'; st.turn = (st.dealer + 1) % 6;
    st.trump = null; st.bidder = -1; st.contract = 0; st.trick = []; st.lastTrick = [];

    if (st.pause) h += '<div class="msg">الأكلة لـ <b>' + esc(nameOf(st, st.lastWinner)) + '</b></div>';
    else if (myTurn) h += '<div class="msg"><b>دورك</b> — اضغط الورقة مرة تختارها، ومرة ثانية ترميها</div>';
    else h += '<div class="msg">دور <b>' + turnName + '</b></div>';
  } else h += '<div class="msg">…</div>';
  if (pending) h = h.replace('</div>', ' · جاري الإرسال…</div>');
  $('#panel').innerHTML = h;
}
function sortHand(hand, trump) {
  var base = ['S', 'H', 'C', 'D'], ord = trump && trump !== 'N' ? [trump].concat(base.filter(function (s) { return s !== trump; })) : base;
  return hand.slice().sort(function (a, b) {
    var sa = ord.indexOf(E.suit(a)), sb = ord.indexOf(E.suit(b));
    if (sa !== sb) return sa - sb;
    return E.str(b, trump) - E.str(a, trump);
  });
}
function renderHand(st, ms) {
  var el = $('#hand');
  if (ms < 0) { el.innerHTML = '<div class="spect">أنت تتفرّج على اللعبة</div>'; return; }
  var hand = sortHand(st.hands['s' + ms] || [], st.trump);
  var canPlay = st.phase === 'playing' && !st.pause && st.turn === ms && !pending;
  var L = canPlay ? E.legal(st, ms) : [];
  if (selCard && L.indexOf(selCard) < 0) selCard = null;
  var W = el.clientWidth || 340, cw = parseFloat(getComputedStyle(el).getPropertyValue('--cw')) || 56;
  var tmp = document.createElement('div'); tmp.style.width = 'var(--cw)'; el.appendChild(tmp); cw = tmp.getBoundingClientRect().width || cw; el.removeChild(tmp);
  var n = hand.length, step = n > 1 ? Math.min(cw * 0.62, (W - cw) / (n - 1)) : 0, tot = cw + step * (n - 1), x0 = (W - tot) / 2;
  var h = '';
  hand.forEach(function (c, i) {
    var cls = (canPlay ? (L.indexOf(c) >= 0 ? 'legal ' : 'dim ') : '') + (c === selCard ? 'sel ' : '') + (E.suit(c) === st.trump ? 'trumpc' : '');
    h += cardHTML(c, cls, 'left:' + (x0 + i * step).toFixed(1) + 'px;z-index:' + (i + 1));
  });
  el.innerHTML = h;
}
function renderOverlay() {
  var ov = $('#ov'), st = state, h = '';
  if (overlay === 'rules') {
    h = '<div class="sheet"><h2>القوانين</h2><ul class="rules">' +
      '<li><b>٦ لاعبين في ٣ فرق</b>، كل فريق لاعبين متقابلين.</li>' +
      '<li>الورق مجموعتين كاملة ناقص <b>٢ سبيت</b> = ١٠٢ ورقة، لكل لاعب <b>١٧</b>.</li>' +
      '<li><b>٥ جولات</b>، والتوزيع يدور. اللي بعد الموزع يبدأ المزاد.</li>' +
      '<li>المزايدة تدور بالترتيب من <b>٣ إلى ١٧</b>: كل لاعب يزود أو يقول «بس». اللي زايد يرجع يزود إذا باقي لاعبين ما قالوا بس. إذا رجع الدور للمشتري ومحد بعده زايد، يختار: يشتري بنفس الرقم أو يقول بس. إذا الكل قال بس، يتعاد التوزيع (نفس الموزع).</li>' +
      '<li>المشتري يختار الحكم (ما فيه صن).</li>' +
      '<li>بعدها كل فريق يتشاور: المشتري وزميله يقدرون يرفعون عدد المشتري. والفريقين الثانيين كل فريق يحدد عدده (من <b>٣ إلى ١٧</b>)، ويقدر يقول <b>دبل</b> على المشتري.</li>' +
      '<li>ترتيب الحكم مثل البلوت: <b>J 9 A 10 K Q 8 7…2</b>. باقي الأنواع مثل الصن: <b>A 10 K Q J 9 8 7…2</b>. الكمبيوتر اللي في فريقك ما يختار عدد الأكلات، يكون العدد حق زميلك الإنسان.</li>' +
      '<li>الورق مكرر: إذا انلعبت ورقة وحدة من نسختين (مثلاً أكة هاص)، النسخة الثانية تصير أكبر ورقة من نوعها في الجولة. باقي الترتيب ما يتغير. قبل ما تنلعب، النسخة الثانية (b) أكبر من الأولى.</li>' +
      '<li>لازم تنزل من نفس النوع المطلوب. إذا ما عندك النوع، لازم تطخ (تلعب حكم). إلا إذا انت آخر لاعب وزميلك صاحب أكبر ورقة، أو فيه أحد طخ بحكم أكبر من كل أحكامك، فتلعب أي نوع تبيه.</li>' +
      '<li>إذا زميلك لعب الحكم الأعلى، ما تكون مجبور تطلع عليه، تلعب أي ورقة.</li>' +
      '<li>إذا الحكم ملعوب قبلك، لازم تطلع بنفس الرقم أو أكبر لو تقدر. وإذا ما تقدر تطلع (الحكم اللي انلعب أكبر من كل أحكامك)، ما تكون مجبور تلعب حكم، تلعب أي ورقة.</li>' +
      '<li>عندك <b>٣٠ ثانية</b> في دورك. إذا خلصت، الكمبيوتر يلعب عنك ورقة صحيحة.</li>' +
      '<li><b>الحساب:</b> الفريق اللي يجيب عدده ياخذه. اللي ما يجيبه <b>ينسلب</b> عدده. واللي يجيب <b>ضعف</b> عدده أو أكثر ينسلب عدده. واللي يجيب ١٧ وينجحها، نقاطه <b>تنضاعف</b>.</li>' +
      '<li><b>الدبل:</b> إذا الفريق المدبّل جاب عدده والمشتري ما جاب طلبه، ينسلب المشتري <b>ضعف</b> طلبه. وإذا المشتري جاب طلبه وفيه دبل، ياخذ <b>ضعف</b> طلبه.</li>' +
      '<li><b>الصوت:</b> زر 🎙 وقت اللعب، تتكلم ويتحول كلامك لنص يوصل للباقين وينقرى لهم.</li>' +
      '<li>بدون مشاريع.</li></ul><button class="btn" data-a="close">تمام</button></div>';
  } else if (overlay === 'last' && st && st.lastTrick && st.lastTrick.length) {
    var ms = seatOf(st, myKey), base = ms >= 0 ? ms : 0, lt = '', wi = E.winnerIdx(st.lastTrick, st.trump);
    st.lastTrick.forEach(function (t, i) {
      var kk = (t.seat - base + 6) % 6;
      lt += cardHTML(t.card, i === wi ? 'won' : '', 'left:' + (8 + kk * 15) + '%;top:12px;z-index:' + (i + 1));
    });
    h = '<div class="sheet"><h2>آخر أكلة</h2><div class="lasttrick" style="--cw:44px;--ch:62px">' + lt.replace(/class="card/g, 'class="card') + '</div>' +
      '<p class="note" style="text-align:center">أكلها ' + esc(nameOf(st, st.lastTrick[wi].seat)) + ' · الترتيب من اليسار: أنت ثم اللي بعدك</p><button class="btn" data-a="close">رجوع</button></div>';
  } else if (overlay === 'menu' && st) {
    h = '<div class="sheet"><h2>القائمة</h2><button class="btn ghost" data-a="rules">القوانين</button>';
    if (isEngine) h += confirmReset ? '<p class="note" style="text-align:center">متأكد؟ النتيجة كلها بتروح.</p><div class="row"><button class="btn ghost" style="flex:1" data-a="close">لا</button><button class="btn" style="flex:1" data-a="reset">إيه، أنهِ اللعبة</button></div>'
      : '<button class="btn ghost" data-a="askreset">إنهاء اللعبة والرجوع للانتظار</button>';
    h += '<button class="btn" data-a="close">رجوع</button></div>';
  } else if (st && (st.phase === 'roundEnd' || st.phase === 'gameOver')) {
    h = resultSheet(st);
  }
  if (h) { ov.innerHTML = h; ov.hidden = false; } else { ov.hidden = true; ov.innerHTML = ''; }
}
function resultSheet(st) {
  var last = st.history[st.history.length - 1], ms = seatOf(st, myKey), myT = ms >= 0 ? E.team(ms) : -1, h = '<div class="sheet">';
  var o = myT >= 0 ? [myT, (myT + 1) % 3, (myT + 2) % 3] : [0, 1, 2];
  var RES = { ok: '<span class="ok">جاب عدده</span>', short: '<span class="bad">ما جاب</span>', over: '<span class="bad">جاب الضعف</span>' };
  if (st.phase === 'gameOver') {
    var mx = Math.max(st.scores.t0, st.scores.t1, st.scores.t2), ws = [0, 1, 2].filter(function (t) { return st.scores['t' + t] === mx; });
    h += '<h2>' + (ws.length > 1 ? 'تعادل!' : (myT >= 0 && ws[0] === myT ? 'فزتوا! 🏆' : 'انتهت اللعبة')) + '</h2>' +
      '<p class="verdict">' + (ws.length > 1 ? 'تعادل بين ' : 'الفائزين: ') + ws.map(function (t) { return '<b>' + teamNames(st, t) + '</b>'; }).join(' و ') + '</p>';
  } else {
    var bt = E.team(last.bidder);
    h += '<h2>نهاية الجولة ' + last.round + '</h2><p class="verdict">' + esc(nameOf(st, last.bidder)) + ' اشترى <b>' + last.contract + '</b> ' +
      (last.trump === 'N' ? 'صن' : 'حكم ' + SYM[last.trump] + ' ' + SUIT_AR[last.trump]) + '</p>';
    h += '<table class="res"><tr><th>الفريق</th><th>طلب</th><th>أكل</th><th>النتيجة</th><th>نقاط</th></tr>';
    o.forEach(function (t) {
      var k = 't' + t, v = last.d[k];
      h += '<tr><td style="color:' + TCOL[t] + '">' + teamLabel(st, t) + (t === bt ? ' ★' : '') + (last.doubles && last.doubles[k] ? ' <span class="dbl">دبل</span>' : '') + '</td><td>' + last.decl[k] + '</td><td>' + last.won[k] + '</td><td>' + RES[last.res[k]] + '</td><td>' + (v > 0 ? '+' : '') + v + '</td></tr>';
    });
    h += '</table>';
    if (last.dbl === 'bidder') h += '<p class="verdict">المشتري جاب طلبه وهو مدبول وأخذه <span class="ok">مضاعف</span></p>';
    if (last.dbl === 'doubler') h += '<p class="verdict">الدبل نجح — المشتري <span class="bad">انسلب ضعف طلبه</span></p>';
  }
  h += '<table class="res"><tr><th>الجولة</th>' + o.map(function (t) { return '<th style="color:' + TCOL[t] + '">' + teamLabel(st, t) + '</th>'; }).join('') + '</tr>';
  st.history.forEach(function (r) {
    h += '<tr><td>' + r.round + '</td>' + o.map(function (t) { var v = r.d['t' + t]; return '<td>' + (v > 0 ? '+' : '') + v + '</td>'; }).join('') + '</tr>';
  });

  if (st.phase === 'roundEnd') {
    h += ms >= 0 ? '<button class="btn" data-a="next"' + (pending ? ' disabled' : '') + '>' + (st.round >= st.rounds ? 'النتيجة النهائية' : 'الجولة التالية') + '</button>' : '<p class="note" style="text-align:center">بانتظار اللاعبين…</p>';
  } else {
    h += isEngine ? '<button class="btn" data-a="reset">لعبة جديدة</button>' : '<p class="note" style="text-align:center">المضيف يقدر يبدأ لعبة جديدة.</p>';
  }
  return h + '</div>';
}

/* ---------- input ---------- */
function updateCountdowns() {
  var els = document.querySelectorAll('[data-dl]');
  for (var i = 0; i < els.length; i++) els[i].textContent = Math.max(0, Math.ceil((+els[i].getAttribute('data-dl') - Date.now()) / 1000));
}
document.addEventListener('click', function (ev) {
  var c = ev.target.closest('#hand .card');
  if (c) {
    var cd = c.getAttribute('data-c');
    if (!c.classList.contains('legal')) { if (state && state.turn !== seatOf(state, myKey)) toast('مو دورك'); else if (c.classList.contains('dim')) toast('لازم تلعب ورقة ثانية حسب القانون'); return; }
    if (selCard === cd) { selCard = null; act({ t: 'play', c: cd }); } else { selCard = cd; render(); }
    return;
  }
  var b = ev.target.closest('[data-a]'); if (!b || b.disabled) return;
  var a = b.getAttribute('data-a');
  if (a === 'kick') { ev.stopPropagation(); hostKick(+b.getAttribute('data-i')); return; }
  switch (a) {
    case 'join': doJoin(); break;
    case 'leave': doLeave(); break;
    case 'seat': hostSeatTap(+b.getAttribute('data-i')); break;
    case 'bots': hostBots(); break;
    case 'start': hostStart(); break;
    case 'bid': act({ t: 'bid', bid: +b.getAttribute('data-v') }); break;
    case 'pass': act({ t: 'pass' }); break;
    case 'trump': act({ t: 'trump', s: b.getAttribute('data-s') }); break;
    case 'next': act({ t: 'next' }); break;
    case 'dpick': declPick = +b.getAttribute('data-v'); render(); break;
    case 'dbl': declDbl = !declDbl; render(); break;
    case 'declare': if (declPick >= 0) { act({ t: 'declare', bid: declPick, dbl: declDbl }); declPick = -1; declDbl = false; } break;
    case 'rules': overlay = 'rules'; render(); break;
    case 'last': overlay = 'last'; render(); break;
    case 'menu': overlay = 'menu'; confirmReset = false; render(); break;
    case 'askreset': confirmReset = true; render(); break;
    case 'reset': hostReset(); break;
    case 'close': overlay = null; confirmReset = false; render(); break;
    case 'mic': micToggle(); break;
    case 'copy': copyLink(); break;
    case 'music': Music.toggle(); render(); break;
  }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter' && ev.target.id === 'nameIn') doJoin();
});
window.addEventListener('resize', function () { if (state && state.phase !== 'lobby') render(); });
setInterval(updateCountdowns, 500);
boot();
</script>
